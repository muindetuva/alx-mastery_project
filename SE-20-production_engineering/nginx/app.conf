server {
    listen 443 ssl;
    server_name quotes.tuva.dev;

    ssl_certificate /etc/letsencrypt/live/quotes.tuva.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quotes.tuva.dev/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name quotes.tuva.dev;

    return 301 https://$host$request_uri;
}
